name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK (ANDROID_HOME). Accept licences and
      # make sure the platform/build-tools we compile against are present.
      - name: Set up Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check that no secrets are committed
        shell: bash
        run: |
          # Fails the build if something that looks like a real key or a signing store is tracked.
          if git ls-files | grep -E '\.(jks|keystore|p12)$|google-services\.json$|(^|/)local\.properties$'; then
            echo "::error::Signing material or local config is tracked in git"; exit 1
          fi
          if git grep -n -E 'sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|ghp_[A-Za-z0-9]{30,}' -- . ':!*.md' ; then
            echo "::error::Something that looks like an API key is committed"; exit 1
          fi

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Build unsigned release APK (compile check, no secrets used)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee release.log

      - name: Test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Android CI"
            echo
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r=ET.parse(p).getroot()
              t+=int(r.get("tests",0)); f+=int(r.get("failures",0)); e+=int(r.get("errors",0)); s+=int(r.get("skipped",0))
          print(f"Unit tests: **{t}** run, **{f}** failed, **{e}** errors, **{s}** skipped")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface build errors as annotations
        if: failure()
        run: |
          cat build.log release.log 2>/dev/null > all.log || true
          [ -s all.log ] || exit 0
          msg=$(grep -E -A3 '^e: |What went wrong|FAILED|error:' all.log | head -60 \
            | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle build failed::${msg}"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
