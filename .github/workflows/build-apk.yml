name: Build FocusFlow APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci || npm install

      - name: Build FocusFlow web bundle
        run: npm run build

      - name: Sync web bundle into Android project
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare FocusFlow APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FocusFlow.apk

      - name: Upload FocusFlow APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-APK
          path: FocusFlow.apk
          retention-days: 30
